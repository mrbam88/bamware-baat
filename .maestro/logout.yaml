appId: com.example.baat
---
- runFlow: login.yaml

- tapOn:
    id: "tab-profile"

- extendedWaitUntil:
    visible:
      id: "profile-email"
    timeout: 8000

- assertVisible: ${MAESTRO_TEST_EMAIL}

- scroll
- scroll

- tapOn:
    id: "sign-out-button"

- extendedWaitUntil:
    visible: "Sign in"
    timeout: 8000

- assertVisible: "Baat"
