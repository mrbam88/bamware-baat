name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx jest --ci

      - name: No committed secrets
        run: |
          if git ls-files | grep -qE '\.(p8|p12|jks|mobileprovision|pem)$'; then
            echo "::error::Credential files are tracked in git — remove them and use EAS/GitHub secrets."
            git ls-files | grep -E '\.(p8|p12|jks|mobileprovision|pem)$'
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Scans the current tree only (--no-git): catches NEW inline secrets.
      # Historical leaks are documented in SECURITY.md and revoked; a
      # full-history scan would flag them forever.
      - name: Gitleaks (inline secret scan, working tree)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --no-git --source . --redact --exit-code 1
